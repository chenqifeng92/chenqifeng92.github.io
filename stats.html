<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="robots" content="noindex, nofollow" />
	<title>访问统计 · 陈棋烽简历站</title>
	<style>
		/* 纯白极简风：无边框卡片，靠留白 + 细分隔线分区，大数字大图做主角 */
		:root {
			--text: #1a1a1a;
			--muted: #9a9a9a;
			--faint: #e3e3e3;
			--line: #efefef;
			--track: #f6f6f6;
			--hover: #fafafa;
			--bar-1: #1a1a1a;
			--bar-2: #9a9a9a;
			--bar-3: #dcdcdc;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			background: #fff;
			color: var(--text);
			font: 14px/1.7 -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
			-webkit-font-smoothing: antialiased;
			-webkit-text-size-adjust: 100%;
			overflow-x: hidden;
		}

		.page {
			max-width: 960px;
			margin: 0 auto;
			padding: 52px 24px 80px;
		}

		/* ---------- 头部 ---------- */
		header {
			position: relative;
			display: flex;
			flex-wrap: wrap;
			gap: 14px;
			align-items: flex-end;
			justify-content: space-between;
			padding-bottom: 26px;
			border-bottom: 1px solid var(--line);
		}

		h1 {
			font-size: 26px;
			margin: 0 0 6px;
			font-weight: 700;
			letter-spacing: .3px;
		}

		.sub {
			margin: 0;
			color: var(--muted);
			font-size: 13px;
		}

		/* 天数分段控件 */
		.seg {
			display: flex;
			border: 1px solid var(--text);
			border-radius: 7px;
			overflow: hidden;
		}

		.seg button {
			border: 0;
			background: #fff;
			color: var(--text);
			padding: 7px 15px;
			cursor: pointer;
			font-size: 12.5px;
			border-right: 1px solid var(--line);
			transition: background .15s;
		}

		.seg button:last-child {
			border-right: 0;
		}

		.seg button.active {
			background: var(--text);
			color: #fff;
		}

		.seg button:not(.active):hover {
			background: var(--hover);
		}

		/* 语言开关：胶囊滑动指示器，absolute 悬浮在 header 右外侧留白区；
		   bottom:26px = header 内容区底缘 = 日期控件底缘（flex-end），两者平行。
		   水平位置自适应：理想为容器右缘外 188px；视口收窄时 max() 自动收紧，
		   保证开关右缘距视口右缘始终 ≥16px（496 = 容器内容宽 960/2 + 16），不飞出屏幕 */
		.lang-toggle {
			position: absolute;
			right: max(-188px, calc(496px - 50vw));
			bottom: 26px;
			display: inline-flex;
			border: 1px solid var(--text);
			border-radius: 999px;
			background: #fff;
			overflow: hidden;
			user-select: none;
		}

		/* 视口过窄（<1160px，开关外挂会压到日期控件）时，回落 header 流内排日期右侧 */
		@media (max-width: 1160px) {
			.lang-toggle {
				position: relative;
				right: auto;
				bottom: auto;
			}

			header>div:first-child {
				flex: 1;
			}
		}

		.lang-toggle button {
			position: relative;
			z-index: 1;
			border: 0;
			background: transparent;
			color: var(--text);
			width: 38px;
			padding: 5px 0;
			cursor: pointer;
			font-size: 11.5px;
			line-height: 1;
			transition: color .25s;
		}

		.lang-toggle button.active {
			color: #fff;
		}

		.lang-thumb {
			position: absolute;
			top: 0;
			left: 0;
			width: 50%;
			height: 100%;
			background: var(--text);
			border-radius: 999px;
			transition: transform .25s cubic-bezier(.22, .61, .36, 1);
		}

		.lang-toggle.en .lang-thumb {
			transform: translateX(100%);
		}

		/* ---------- 密钥 / 状态 ---------- */
		.key-row {
			display: flex;
			gap: 8px;
			margin: 16px 0 0;
		}

		.key-row input {
			flex: 1;
			border: 1px solid var(--faint);
			background: #fff;
			color: var(--text);
			padding: 8px 12px;
			border-radius: 6px;
			font-size: 13px;
		}

		.key-row button {
			border: 1px solid var(--text);
			background: var(--text);
			color: #fff;
			padding: 7px 16px;
			cursor: pointer;
			border-radius: 6px;
			font-size: 13px;
		}

		.status {
			min-height: 22px;
			color: var(--muted);
			font-size: 13px;
			margin: 14px 0 0;
		}

		.hidden {
			display: none;
		}

		/* ---------- 区块节奏：留白 + 细线分隔 ---------- */
		main>section {
			padding: 42px 0 38px;
			border-bottom: 1px solid var(--line);
		}

		main>section.last {
			border-bottom: 0;
		}

		.block-head {
			display: flex;
			align-items: baseline;
			justify-content: space-between;
			margin-bottom: 22px;
		}

		h2 {
			font-size: 15px;
			margin: 0;
			font-weight: 600;
			letter-spacing: .2px;
		}

		.hint {
			font-size: 12px;
			color: var(--muted);
		}

		/* ---------- KPI 区（无边框一排，大数字） ---------- */
		.cards {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
			gap: 18px 12px;
			padding: 34px 0 30px;
			border-bottom: 1px solid var(--line);
		}

		.stat-icon {
			font-size: 15px;
			display: block;
			margin-bottom: 8px;
			opacity: .85;
		}

		.stat-val {
			font-size: 32px;
			font-weight: 700;
			line-height: 1.1;
			font-variant-numeric: tabular-nums;
			letter-spacing: -.5px;
		}

		.stat-sub {
			font-size: 11px;
			color: var(--muted);
			margin-top: 3px;
		}

		.stat-label {
			font-size: 12.5px;
			color: var(--muted);
			margin-top: 6px;
		}

		.stat-delta {
			display: inline-block;
			font-size: 11px;
			color: var(--muted);
			background: var(--track);
			border-radius: 999px;
			padding: 2px 9px;
			margin-top: 7px;
		}

		.stat-delta.up {
			color: #1a7f37;
		}

		.stat-delta.down {
			color: #b3261e;
		}

		/* ---------- 互动旅程 ---------- */
		.journey-row {
			display: flex;
			align-items: center;
			gap: 14px;
			margin: 14px 0;
		}

		.j-label {
			width: 120px;
			flex: none;
			font-size: 13px;
			display: flex;
			align-items: center;
			gap: 7px;
		}

		.j-track {
			flex: 1;
			height: 24px;
			background: var(--track);
			border-radius: 6px;
			overflow: hidden;
		}

		.j-fill {
			height: 100%;
			border-radius: 6px;
			min-width: 2px;
			transition: width .6s cubic-bezier(.22, .61, .36, 1);
		}

		.j-val {
			flex: none;
			text-align: right;
			width: 116px;
			font-size: 12.5px;
			color: var(--muted);
			font-variant-numeric: tabular-nums;
		}

		.j-val b {
			color: var(--text);
			font-size: 14.5px;
			font-weight: 650;
		}

		/* ---------- 图表 ---------- */
		#chart {
			overflow-x: auto;
		}

		#chart svg {
			display: block;
		}

		#chart .bar-1 {
			fill: var(--bar-1);
		}

		#chart .bar-2 {
			fill: var(--bar-2);
		}

		#chart .bar-3 {
			fill: var(--bar-3);
		}

		#chart rect {
			transition: opacity .12s;
			cursor: default;
		}

		#chart rect:hover {
			opacity: .7;
		}

		.legend {
			margin: 12px 0 0;
			font-size: 12px;
			color: var(--muted);
			display: flex;
			flex-wrap: wrap;
			gap: 6px 18px;
		}

		.legend span {
			display: inline-flex;
			align-items: center;
			gap: 6px;
		}

		.legend i {
			width: 10px;
			height: 10px;
			border-radius: 3px;
			display: inline-block;
		}

		/* ---------- 分布 ---------- */
		.grid-3 {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
			gap: 28px;
		}

		.hbar-row {
			display: flex;
			align-items: center;
			gap: 10px;
			margin: 10px 0;
			font-size: 13px;
		}

		.hbar-label {
			width: 128px;
			flex: none;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.hbar-track {
			flex: 1;
			height: 12px;
			background: var(--track);
			border-radius: 6px;
			overflow: hidden;
		}

		.hbar-fill {
			display: block;
			height: 100%;
			background: var(--text);
			border-radius: 6px;
			transition: width .5s ease;
		}

		.hbar-val {
			width: 42px;
			text-align: right;
			flex: none;
			color: var(--muted);
			font-variant-numeric: tabular-nums;
		}

		/* ---------- 表格 ---------- */
		.table-wrap {
			overflow-x: auto;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			font-size: 13px;
		}

		th,
		td {
			text-align: left;
			padding: 9px 12px;
			border-bottom: 1px solid var(--line);
			white-space: nowrap;
		}

		th:first-child,
		td:first-child {
			padding-left: 0;
		}

		th {
			color: var(--muted);
			font-weight: 500;
			font-size: 12px;
		}

		tbody tr:hover {
			background: var(--hover);
		}

		tbody tr:last-child td {
			border-bottom: 0;
		}

		.tag {
			display: inline-block;
			padding: 1px 9px;
			border-radius: 999px;
			background: var(--track);
			font-size: 11.5px;
			color: var(--text);
		}

		.mono {
			font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
			font-size: 12px;
		}

		/* ---------- 提问气泡 ---------- */
		.qlist {
			list-style: none;
			margin: 0;
			padding: 0;
		}

		.qlist li {
			display: flex;
			justify-content: space-between;
			gap: 16px;
			padding: 13px 0;
			border-bottom: 1px solid var(--line);
		}

		.qlist li:last-child {
			border-bottom: 0;
		}

		.q-meta {
			flex: none;
			width: 180px;
			font-size: 11.5px;
			color: var(--muted);
			line-height: 1.6;
			padding-top: 4px;
		}

		.q-bubble {
			flex: 1;
			background: var(--track);
			border-radius: 2px 14px 14px 14px;
			padding: 10px 14px;
			font-size: 13.5px;
			line-height: 1.6;
		}

		.empty {
			color: var(--muted);
			margin: 0;
			padding: 22px 0 8px;
			text-align: center;
			font-size: 13px;
		}

		footer {
			margin-top: 48px;
			text-align: center;
			color: var(--faint);
			font-size: 12px;
		}

		@media (max-width: 640px) {
			.q-meta {
				width: 100%;
			}

			.qlist li {
				flex-direction: column;
				gap: 6px;
			}

			.j-label {
				width: 108px;
			}

			.j-val {
				width: 96px;
			}

			.cards {
				grid-template-columns: repeat(3, 1fr);
			}

			.stat-val {
				font-size: 26px;
			}

			/* 触摸目标放大：移动端可点击区域 ≥36px 高 */
			.seg button {
				padding: 9px 16px;
				font-size: 13px;
			}

			.lang-toggle button {
				width: 42px;
				padding: 9px 0;
				font-size: 12px;
			}

			.key-row input {
				padding: 10px 12px;
			}

			.key-row button {
				padding: 10px 16px;
			}
		}
	</style>
</head>

<body>
	<div class="page">
		<header>
			<div>
				<h1 id="t-title">简历站访问统计</h1>
				<p class="sub" id="sub"></p>
			</div>
			<div class="seg">
				<button type="button" data-days="7">7 天</button>
				<button type="button" data-days="14">14 天</button>
				<button type="button" data-days="30">30 天</button>
			</div>
			<!-- 语言开关：absolute 脱离 header 流，悬浮在容器右外侧留白区，与日期控件底对齐 -->
			<div class="lang-toggle" id="lang-toggle" role="switch" aria-label="Language">
				<div class="lang-thumb"></div>
				<button type="button" data-lang="zh">中</button>
				<button type="button" data-lang="en">EN</button>
			</div>
		</header>

		<div id="key-row" class="key-row hidden">
			<input id="key-input" type="password" />
			<button type="button" id="key-save"></button>
		</div>
		<div id="status" class="status"></div>

		<main id="main" class="hidden">
			<section id="cards" class="cards"></section>

			<section>
				<div class="block-head">
					<h2 id="t-journey">🧭 访客互动旅程</h2>
					<span class="hint" id="t-journey-hint">以页面浏览量为基准</span>
				</div>
				<div id="journey"></div>
			</section>

			<section>
				<div class="block-head">
					<h2 id="t-chart">📊 每日访问与互动</h2>
					<span class="hint" id="t-chart-hint">悬停柱子查看明细</span>
				</div>
				<div id="chart"></div>
				<p class="legend">
					<span><i style="background:var(--bar-1)"></i><b id="t-leg-1">打开页面</b></span>
					<span><i style="background:var(--bar-2)"></i><b id="t-leg-2">打开聊天</b></span>
					<span><i style="background:var(--bar-3)"></i><b id="t-leg-3">提问</b></span>
				</p>
			</section>

			<section>
				<div class="grid-3">
					<div>
						<h2 id="t-by-site">🌐 来源站</h2>
						<div id="by-site" style="margin-top:18px"></div>
					</div>
					<div>
						<h2 id="t-by-device">📱 访问设备</h2>
						<div id="by-device" style="margin-top:18px"></div>
					</div>
					<div>
						<h2 id="t-by-duration">⏱ 停留时长</h2>
						<div id="by-duration" style="margin-top:18px"></div>
					</div>
				</div>
			</section>

			<section>
				<h2 id="t-recent">🕒 最近事件</h2>
				<div class="table-wrap" style="margin-top:18px">
					<table id="recent"></table>
				</div>
			</section>

			<section class="last">
				<h2 id="t-questions">💬 访客都在问什么</h2>
				<ul id="questions" class="qlist" style="margin-top:12px"></ul>
			</section>
		</main>

		<footer id="t-footer">数据来自简历页访问埋点，自动收集 · 仅自己可见</footer>
	</div>

	<script>
		(function () {

			/* ---------- 双语文案 ---------- */
			var I18N = {

			};

			var lang = localStorage.getItem('qf-stats-lang');
			if (lang !== 'en') lang = 'zh'; // 默认中文，仅记忆 zh/en
			var L = I18N[lang];

			function $(id) { return document.getElementById(id); }

			// 访客可控文本（提问原文/IP）一律转义，防注入
			function esc(s) {
				return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
					return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
				});
			}

			function fmtDur(sec) {
				if (sec == null) return '—';
				if (sec < 60) return sec + (lang === 'zh' ? ' 秒' : 's');
				if (sec < 3600) return Math.floor(sec / 60) + (lang === 'zh' ? ' 分 ' : 'm ') + (sec % 60) + (lang === 'zh' ? ' 秒' : 's');
				return (sec / 3600).toFixed(1) + (lang === 'zh' ? ' 小时' : 'h');
			}

			function pad2(n) { return String(n).padStart(2, '0'); }

			// 最近 n 个自然日（含今天，本地时区），用于补零的连续时间轴
			function dateSeries(n) {
				var arr = [];
				var now = new Date();
				for (var i = n - 1; i >= 0; i--) {
					var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
					arr.push(d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()));
				}
				return arr;
			}

			var days = parseInt(localStorage.getItem('qf-stats-days') || '14', 10);
			if ([7, 14, 30].indexOf(days) === -1) days = 14;
			var lastData = null; // 语言切换时用它重渲染，不重新请求

			function setActiveDays() {
				document.querySelectorAll('.seg button[data-days]').forEach(function (b) {
					b.classList.toggle('active', parseInt(b.dataset.days, 10) === days);
				});
			}

			function setLangUI() {
				var toggle = $('lang-toggle');
				toggle.classList.toggle('en', lang === 'en');
				toggle.querySelectorAll('button').forEach(function (b) {
					b.classList.toggle('active', b.dataset.lang === lang);
				});
				document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
				document.title = L.docTitle;

				$('t-title').textContent = L.title;
				$('t-journey').textContent = L.journey;
				$('t-journey-hint').textContent = L.journeyHint;
				$('t-chart').textContent = L.chart;
				$('t-chart-hint').textContent = L.chartHint;
				$('t-leg-1').textContent = L.legPage;
				$('t-leg-2').textContent = L.legChat;
				$('t-leg-3').textContent = L.legAsk;
				$('t-by-site').textContent = L.bySite;
				$('t-by-device').textContent = L.byDevice;
				$('t-by-duration').textContent = L.byDuration;
				$('t-recent').textContent = L.recent;
				$('t-questions').textContent = L.questions;
				$('t-footer').textContent = L.footer;
				$('key-input').placeholder = L.keyPlaceholder;
				$('key-save').textContent = L.keySave;
				document.querySelectorAll('.seg button[data-days]').forEach(function (b, i) {
					b.textContent = L.days[i];
				});
				if (lastData) {
					var t = new Date().toLocaleTimeString(lang === 'zh' ? 'zh-CN' : 'en-US', { hour: '2-digit', minute: '2-digit' });
					$('sub').textContent = L.sub(days, t);
				}
			}

			// 数字滚动动画：0 → target，500ms ease-out
			function countUp(el, target) {
				if (!target || target <= 0) { el.textContent = '0'; return; }
				var start = null;
				function step(ts) {
					if (!start) start = ts;
					var p = Math.min((ts - start) / 500, 1);
					el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3))).toLocaleString();
					if (p < 1) requestAnimationFrame(step);
				}
				requestAnimationFrame(step);
			}

			// 环比：by_day 双倍窗口，后半程 vs 前半程
			function deltaOf(byDay, eventType) {
				var winStart = dateSeries(days)[0];
				var cur = 0, prev = 0;
				byDay.forEach(function (r) {
					if (r.event_type !== eventType) return;
					if (r.d >= winStart) cur += r.n; else prev += r.n;
				});
				if (!prev) return cur ? L.newData : '';
				var pct = Math.round((cur - prev) / prev * 100);
				if (pct === 0) return L.flat;
				return (pct > 0 ? '▲ ' : '▼ ') + Math.abs(pct) + '%';
			}

			function deltaClass(text) {
				if (text.indexOf('▲') !== -1) return 'up';
				if (text.indexOf('▼') !== -1) return 'down';
				return '';
			}

			function bar(rows, labelFn) {
				var max = Math.max.apply(null, rows.map(function (r) { return r.n; }).concat([1]));
				var html = rows.map(function (r) {
					var pct = Math.round((r.n / max) * 100);
					return '<div class="hbar-row"><span class="hbar-label">' + esc(labelFn(r.k)) + '</span>' +
						'<span class="hbar-track"><span class="hbar-fill" style="width:' + pct + '%"></span></span>' +
						'<span class="hbar-val">' + r.n + '</span></div>';
				}).join('');
				return html || '<p class="empty">' + esc(L.noData) + '</p>';
			}

			// ---------- 访客互动旅程（以 pageview 为基准的横条） ----------
			function renderJourney(data) {
				var t = {};
				data.totals.forEach(function (r) { t[r.event_type] = r.n; });
				var base = t.pageview || 0;
				var journey = [
					{ key: 'pageview', icon: '👁', label: L.jViewed, fill: 'var(--bar-1)' },
					{ key: 'chat_open', icon: '💬', label: L.jChat, fill: 'var(--bar-2)' },
					{ key: 'chat_question', icon: '❓', label: L.jAsked, fill: 'var(--bar-2)' },
					{ key: 'print_click', icon: '🖨', label: L.jPrint, fill: 'var(--bar-3)' }
				];
				var html = journey.map(function (j) {
					var v = t[j.key] || 0;
					var pct = base ? Math.round(v / base * 100) : 0;
					var width = base ? Math.max(Math.round(v / base * 100), v > 0 ? 2 : 0) : 0;
					return '<div class="journey-row">' +
						'<span class="j-label">' + j.icon + ' ' + esc(j.label) + '</span>' +
						'<span class="j-track"><span class="j-fill" style="width:' + width + '%;background:' + j.fill + '"></span></span>' +
						'<span class="j-val"><b>' + v + '</b> · ' + pct + '%</span>' +
						'</div>';
				}).join('');
				$('journey').innerHTML = html || '<p class="empty">' + esc(L.noData) + '</p>';
			}

			// ---------- 汇总卡（无边框 KPI 一排 + 数字滚动 + 环比 pill） ----------
			function renderCards(data) {
				var t = {};
				data.totals.forEach(function (r) { t[r.event_type] = r.n; });
				var totalPv = t.pageview || 0;
				var cards = [
					{ icon: '👁', label: L.pageViews, value: totalPv, count: true, delta: deltaOf(data.by_day, 'pageview') },
					{ icon: '💬', label: L.chatsOpened, value: t.chat_open || 0, count: true, delta: deltaOf(data.by_day, 'chat_open') },
					{ icon: '❓', label: L.questions, value: t.chat_question || 0, count: true, delta: deltaOf(data.by_day, 'chat_question') },
					{ icon: '🖨', label: L.prints, value: t.print_click || 0, count: true, delta: deltaOf(data.by_day, 'print_click') },
					{ icon: '⏱', label: L.avgStay, value: fmtDur(data.avg_duration_seconds), small: data.duration_samples + L.samples },
					{ icon: '👥', label: L.uniqueVisitors, value: data.unique_visitors_total || 0, count: true, small: L.uvSub(data.unique_visitors_window || 0, days) }
				];
				$('cards').innerHTML = cards.map(function (c, i) {
					return '<div class="stat">' +
						'<span class="stat-icon">' + c.icon + '</span>' +
						'<div class="stat-val"' + (c.count ? ' id="statv-' + i + '"' : '') + '>' + (c.count ? 0 : esc(c.value)) + '</div>' +
						(c.small ? '<div class="stat-sub">' + esc(c.small) + '</div>' : '') +
						'<div class="stat-label">' + esc(c.label) + '</div>' +
						(c.delta ? '<span class="stat-delta ' + deltaClass(c.delta) + '">' + esc(c.delta) + ' ' + esc(L.deltaSuffix) + '</span>' : '') +
						'</div>';
				}).join('');
				cards.forEach(function (c, i) {
					if (c.count) countUp($('statv-' + i), c.value);
				});
			}

			// ---------- 柱状图（补零连续日期 + 悬停提示） ----------
			function renderChart(data) {
				var dayMap = {};
				data.by_day.forEach(function (r) {
					if (!dayMap[r.d]) dayMap[r.d] = {};
					dayMap[r.d][r.event_type] = r.n;
				});
				var series = [
					{ key: 'pageview', cls: 'bar-1', name: L.legPage },
					{ key: 'chat_open', cls: 'bar-2', name: L.legChat },
					{ key: 'chat_question', cls: 'bar-3', name: L.legAsk }
				];
				var dates = dateSeries(days);
				var max = 1;
				dates.forEach(function (d) {
					series.forEach(function (s) { max = Math.max(max, (dayMap[d] || {})[s.key] || 0); });
				});
				// 宽度下限 480：小屏柱子不至于压成细线，超出容器由 #chart 横向滚动
				var W = Math.max(480, Math.min(900, document.querySelector('.page').clientWidth - 48));
				var H = 240, padL = 38, padB = 32, padT = 16;
				var innerW = W - padL - 10, innerH = H - padT - padB;
				var groupW = innerW / Math.max(dates.length, 1);
				var barW = Math.min(15, Math.max(4, Math.floor(groupW / 4.6)));
				var svg = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(L.chart) + '">';
				for (var g = 0; g <= 4; g++) {
					var y = padT + innerH - (innerH * g / 4);
					var val = Math.ceil(max * g / 4);
					svg += '<line x1="' + padL + '" y1="' + y + '" x2="' + (W - 10) + '" y2="' + y + '" stroke="var(--line)" stroke-width="1"/>';
					svg += '<text x="' + (padL - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="10" fill="var(--muted)">' + val + '</text>';
				}
				dates.forEach(function (d, i) {
					var gx = padL + groupW * i;
					series.forEach(function (s, si) {
						var v = (dayMap[d] || {})[s.key] || 0;
						var h = Math.round((v / max) * innerH);
						var x = gx + (groupW - barW * 3 - 6) / 2 + si * (barW + 3);
						var y = padT + innerH - h;
						svg += '<rect class="' + s.cls + '" x="' + x + '" y="' + y + '" width="' + barW + '" height="' + Math.max(h, v > 0 ? 2 : 0) + '" rx="2.5"><title>' + esc(d + ' · ' + s.name + '：' + v) + '</title></rect>';
					});
					var show = dates.length <= 16 || i % 2 === 0;
					if (show) {
						svg += '<text x="' + (gx + groupW / 2) + '" y="' + (H - 9) + '" text-anchor="middle" font-size="9.5" fill="var(--muted)">' + esc(d.slice(5)) + '</text>';
					}
				});
				svg += '</svg>';
				$('chart').innerHTML = svg;
			}

			function render(data) {
				renderCards(data);
				renderJourney(data);
				renderChart(data);
				$('by-site').innerHTML = bar(data.by_site.map(function (r) { return { k: r.site, n: r.n }; }), function (k) { return L.site[k] || k || '—'; });
				$('by-device').innerHTML = bar(data.by_device.map(function (r) { return { k: r.device, n: r.n }; }), function (k) { return L.device[k] || k; });
				$('by-duration').innerHTML = bar(data.duration_buckets.map(function (r) { return { k: r.bucket, n: r.n }; }), function (k) { return L.buckets[k] || k; });

				var rows = data.recent_events.map(function (e) {
					return '<tr><td class="mono">' + esc(e.t) + '</td><td>' + esc(L.site[e.site] || e.site || '—') + '</td><td><span class="tag">' + esc(L.event[e.event_type] || e.event_type) + '</span></td><td>' + esc((L.device[e.device] || e.device || '').replace(/^[^ ]+ /, '')) + '</td><td class="mono">' + esc(e.ip || '—') + '</td></tr>';
				}).join('');
				$('recent').innerHTML = '<thead><tr><th>' + esc(L.thTime) + '</th><th>' + esc(L.thSite) + '</th><th>' + esc(L.thEvent) + '</th><th>' + esc(L.thDevice) + '</th><th>IP</th></tr></thead><tbody>' + (rows || '<tr><td colspan="5" class="empty">' + esc(L.noData) + '</td></tr>') + '</tbody>';

				$('questions').innerHTML = data.recent_questions.map(function (q) {
					return '<li><span class="q-meta">' + esc(q.t) + '<br>' + esc((L.device[q.device] || q.device || '').replace(/^[^ ]+ /, '')) + ' · ' + esc(L.site[q.site] || q.site || '—') + '</span>' +
						'<span class="q-bubble">' + esc(q.payload) + '</span></li>';
				}).join('') || '<li><p class="empty">' + esc(L.questionsEmpty) + '</p></li>';

				var t = new Date().toLocaleTimeString(lang === 'zh' ? 'zh-CN' : 'en-US', { hour: '2-digit', minute: '2-digit' });
				$('sub').textContent = L.sub(days, t);
				$('main').classList.remove('hidden');
			}

			function setStatus(msg) { $('status').textContent = msg || ''; }

			function load() {
				setActiveDays();
				setStatus(L.loading);
				var headers = {};
				var key = localStorage.getItem('qf-stats-key');
				if (key) headers['Authorization'] = 'Bearer ' + key;
				fetch(API + '?days=' + days, { headers: headers })
					.then(function (resp) {
						if (resp.status === 401) {
							$('key-row').classList.remove('hidden');
							throw new Error('NEED_KEY');
						}
						return resp.json();
					})
					.then(function (data) {
						if (!data.ok) { setStatus(L.apiError + (data.error || '')); return; }
						setStatus('');
						lastData = data;
						render(data);
					})
					.catch(function (e) {
						if (e && e.message === 'NEED_KEY') { setStatus(L.needKey); return; }
						setStatus(L.loadFail + (e && e.message ? e.message : L.networkError));
					});
			}

			// 语言切换：记忆选择，用缓存数据即时重渲染（不重新请求）
			document.querySelectorAll('#lang-toggle button').forEach(function (b) {
				b.addEventListener('click', function () {
					if (b.dataset.lang === lang) return;
					lang = b.dataset.lang;
					L = I18N[lang];
					localStorage.setItem('qf-stats-lang', lang);
					setLangUI();
					if (lastData) render(lastData);
				});
			});

			document.querySelectorAll('.seg button[data-days]').forEach(function (b) {
				b.addEventListener('click', function () {
					days = parseInt(b.dataset.days, 10);
					localStorage.setItem('qf-stats-days', String(days));
					load();
				});
			});
			$('key-save').addEventListener('click', function () {
				localStorage.setItem('qf-stats-key', $('key-input').value.trim());
				load();
			});

			setLangUI();
			load();
		})();
	</script>
</body>
